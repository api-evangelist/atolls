note: >-
  Atolls has no corporate developer host (api.atolls.com, developer.atolls.com and
  docs.atolls.com do not resolve), so /.well-known/ discovery was probed across the
  whole owned-brand portfolio instead. Two real document classes are published:
  RFC 9116 security.txt on five hosts, and — the find of this round — an OpenID
  Connect / RFC 8414 discovery document on seven Pepper community hosts.
ownership_note: >-
  Every host below is proven Atolls-owned from the documents themselves, not from
  the fetch URL: each brand security.txt names Policy https://atolls.com/disclosure-policy
  and Contact mailto:security@atolls.com, and mydealz.de, hotukdeals.com, coupons.com
  and pepper.com all publish DMARC rua/ruf pointing at dmarc_rua@atolls.com.

