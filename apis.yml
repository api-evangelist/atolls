name: Atolls
description: 'Atolls (formerly Global Savings Group) is a Munich-based consumer commerce-content
  company that operates the world''s largest shopping engagement platform, running coupon,
  cashback, deals, and shopping-community destinations across more than 20 markets. Its
  brand portfolio includes Coupons.com, Cuponation, iGraal, Shoop, Pouch, mydealz, hotukdeals,
  and Deala, connecting millions of shoppers with offers from thousands of retailers and
  brands through affiliate marketing, cashback, and AI-enhanced shopping insights. Founded
  in 2012 as CupoNation with Rocket Internet and rebranded to Atolls in 2024, it is backed
  by investors including HV Capital, RTP Global, and Rocket Internet. Atolls publishes no
  public developer API, developer portal, OpenAPI document or SDK — api., developer. and
  docs.atolls.com do not resolve — but it does serve real machine-readable documents: RFC
  9116 security.txt files on five owned hosts pointing at a single group-wide Intigriti
  vulnerability disclosure program, and OpenID Connect discovery documents on seven Pepper
  community properties (mydealz, hotukdeals, Dealabs, Preisjaeger, Chollometro, Pepper PL,
  Promodescuentos) that expose an OAuth 2.0 authorization server for consumer sign-in.
  This profile captures that security, identity, and legal surface for the API Evangelist
  network.'
