  - client_secret_post
  pkce:
    supported: true
    code_challenge_methods:
    - S256
    - plain
    note: >-
      `plain` is still advertised alongside S256. Current OAuth 2.1 / BCP guidance is
      S256-only for public clients; advertising `plain` is a downgrade path.
  scopes_supported:
