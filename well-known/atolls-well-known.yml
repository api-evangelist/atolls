  - Applebot-Extended
  - Bytespider
  - CCBot
  - ClaudeBot
  - CloudflareBrowserRenderingCrawler
  - Google-Extended
  - GPTBot
  - meta-externalagent
  note: >-
    Cloudflare-managed content-signal block. This profile was assembled from
    /.well-known/ documents and DNS/TLS records only, consistent with
    use=reference; no page content was collected for AI training.

notes: >-
  No API catalog (RFC 9727), ai-plugin.json, oauth-protected-resource or A2A agent
  card is published on any Atolls host. Several brand hosts answer 200 with an HTML
  shell for arbitrary /.well-known/* paths — those are recorded as misses, not hits.
