name: Atolls
description: 'Atolls (formerly Global Savings Group) is a Munich-based consumer commerce-content
  company that operates the world''s largest shopping engagement platform, running coupon,
  cashback, deals, and shopping-community destinations across more than 20 markets. Its
  brand portfolio includes Coupons.com, Cuponation, iGraal, Shoop, Pouch, mydealz, hotukdeals,
  and Deala, connecting millions of shoppers with offers from thousands of retailers and
  brands through affiliate marketing, cashback, and AI-enhanced shopping insights. Founded
  in 2012 as CupoNation with Rocket Internet and rebranded to Atolls in 2024, it is backed
  by investors including HV Capital, RTP Global, and Rocket Internet. Atolls does not expose
  a public developer API; this profile captures its public consumer, security, and legal
  surface for the API Evangelist network.'
