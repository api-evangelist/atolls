format_note: >-
  Not RFC 9457. The only error envelope Atolls serves on a machine-readable surface is
  the RFC 6749 OAuth 2.0 error object, observed live on the Pepper community token
  endpoint. There is no OpenAPI to derive 4xx/5xx responses from and no published error
  reference page, so this catalog is deliberately small and entirely observed.
envelope:
  content_type: application/json
  fields:
  - name: error
    required: true
    description: RFC 6749 error code.
  - name: error_description
    required: true
    description: Human-readable explanation.
  - name: hint
    required: false
    description: >-
      Non-standard member added by the League OAuth2 Server implementation naming the
      offending parameter. Not part of RFC 6749; clients should not depend on it.
problem_types:
